name: Equipment gateway qualification
on:
  pull_request:
    paths: ["equipment-gateway/**", "scripts/**", "schemas/**", ".github/workflows/equipment-gateway*.yml"]
  push:
    branches: [main]
    paths: ["equipment-gateway/**", "scripts/**", "schemas/**", ".github/workflows/equipment-gateway*.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ./equipment-gateway
      - run: python -m unittest discover -s equipment-gateway/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_repository.py
      - run: equipment-gateway --config equipment-gateway/config.example.json --check
      - run: equipment-gateway --config equipment-gateway/config.access-control.example.json --check
