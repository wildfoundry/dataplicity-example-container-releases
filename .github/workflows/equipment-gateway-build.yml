name: Equipment gateway OCI build
on:
  pull_request:
    paths: ["equipment-gateway/**", "scripts/**", "schemas/**", ".github/workflows/equipment-gateway*.yml"]
  push:
    branches: [main]
    paths: ["equipment-gateway/**", "scripts/**", "schemas/**", ".github/workflows/equipment-gateway*.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: Source package version to prepare for release
        required: true
        default: "0.1.0"
permissions:
  contents: read
concurrency:
  group: equipment-gateway-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Qualify source before building
        run: |
          pip install ./equipment-gateway
          python -m unittest discover -s equipment-gateway/tests -v
          python -m unittest discover -s tests -v
          python scripts/verify_repository.py
      - name: Build and smoke-test native OCI image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -p native-assets
          docker buildx create --use --driver docker-container
          docker buildx build equipment-gateway --platform "linux/$ARCHITECTURE" --provenance=false --sbom=false --output "type=oci,dest=native-assets/$ARCHITECTURE.tar"
          docker buildx build equipment-gateway --platform "linux/$ARCHITECTURE" --load --tag equipment-gateway-qualification:local
          docker run --rm -v "$PWD/equipment-gateway/config.access-control.example.json:/etc/equipment-gateway/config.json:ro" -v "$PWD/equipment-gateway/profiles:/etc/equipment-gateway/profiles:ro" equipment-gateway-qualification:local --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: equipment-gateway-linux-${{ matrix.architecture }}
          path: native-assets/
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: equipment-gateway-linux-*
          merge-multiple: true
          path: native-assets
      - name: Assemble and verify multi-platform release
        env:
          REQUESTED_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          python3 -c 'import os,tomllib; assert os.environ["REQUESTED_VERSION"] == tomllib.load(open("equipment-gateway/pyproject.toml","rb"))["project"]["version"]'
          mkdir -p release-assets
          python3 scripts/combine_equipment_oci.py native-assets "release-assets/equipment-gateway_${REQUESTED_VERSION}_oci.tar" --metadata build-metadata.json
          python3 scripts/build_equipment_manifest.py release-assets --version "$REQUESTED_VERSION" --metadata build-metadata.json
          python3 scripts/verify_release.py release-assets --tag "equipment-gateway/v${REQUESTED_VERSION}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: equipment-gateway-release-assets
          path: release-assets/
