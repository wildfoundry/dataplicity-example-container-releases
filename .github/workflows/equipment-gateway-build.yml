name: Equipment gateway OCI build
on:
  pull_request:
    paths: ["equipment-gateway/**", "scripts/**", "schemas/**", ".github/workflows/equipment-gateway*.yml"]
  push:
    branches: [main]
    paths: ["equipment-gateway/**", "scripts/**", "schemas/**", ".github/workflows/equipment-gateway*.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: Source package version to prepare for release
        required: true
        default: "0.1.0"
permissions:
  contents: read
concurrency:
  group: equipment-gateway-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Qualify source before building
        run: |
          pip install ./equipment-gateway
          python -m unittest discover -s equipment-gateway/tests -v
          python -m unittest discover -s tests -v
          python scripts/verify_repository.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build multi-platform OCI bundle
        env:
          REQUESTED_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          python3 -c 'import os,tomllib; assert os.environ["REQUESTED_VERSION"] == tomllib.load(open("equipment-gateway/pyproject.toml","rb"))["project"]["version"]'
          mkdir -p release-assets
          docker buildx build equipment-gateway --platform linux/amd64,linux/arm64 --provenance=false --sbom=false --metadata-file build-metadata.json --output "type=oci,dest=release-assets/equipment-gateway_${REQUESTED_VERSION}_oci.tar"
          python3 scripts/build_equipment_manifest.py release-assets --version "$REQUESTED_VERSION" --metadata build-metadata.json
          python3 scripts/verify_release.py release-assets --tag "equipment-gateway/v${REQUESTED_VERSION}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: equipment-gateway-release-assets
          path: release-assets/
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: equipment-gateway-release-assets
          path: release-assets
      - name: Verify source and release bundle
        run: |
          python3 -c 'import json,os; m=json.load(open("release-assets/release-manifest.json")); assert m["source_commit"] == os.environ["GITHUB_SHA"]; assert m["source_repository"] == os.environ["GITHUB_REPOSITORY"]'
          tag=$(python3 -c 'import json; print(json.load(open("release-assets/release-manifest.json"))["tag"])')
          python3 scripts/verify_release.py release-assets --tag "$tag"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*_oci.tar
      - name: Publish immutable qualification prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("release-assets/release-manifest.json"))["tag"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --dir existing-release
            python3 scripts/verify_release.py existing-release --tag "$tag"
            cmp release-assets/release-manifest.json existing-release/release-manifest.json
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$tag" --prerelease --notes "Reusable equipment gateway qualification build. Includes AMD64/ARM64 OCI archive, source/digest manifest and checksums. Simulated reference profiles are explicitly labelled; no OEM or physical commissioning qualification is implied."
          fi
          gh release download "$tag" --dir published-release
          python3 scripts/verify_release.py published-release --tag "$tag"
          gh attestation verify published-release/*_oci.tar --repo "$GITHUB_REPOSITORY"
